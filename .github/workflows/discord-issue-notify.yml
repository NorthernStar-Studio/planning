name: Discord Issue Notifications

on:
  issues:
    types: [opened, closed, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Determine message type
          if [ "${{ github.event_name }}" == "issues" ]; then
            case "${{ github.event.action }}" in
              opened) EMOJI="🆕"; TITLE="New Issue" ;;
              closed) EMOJI="✅"; TITLE="Issue Closed" ;;
              reopened) EMOJI="🔄"; TITLE="Issue Reopened" ;;
              edited) EMOJI="📝"; TITLE="Issue Updated" ;;
            esac
          else
            EMOJI="💬"; TITLE="Issue Comment"
          fi

          # Build embed
          JSON=$(cat <<EOF
          {
            "embeds": [{
              "title": "$EMOJI $TITLE: ${{ github.event.issue.title }}",
              "url": "${{ github.event.issue.html_url }}",
              "color": "${{ github.event.action == 'opened' && '15158332' || '3066993' }}",
              "fields": [
                {"name": "Repo", "value": "${{ github.repository }}", "inline": true},
                {"name": "Issue #", "value": "${{ github.event.issue.number }}", "inline": true},
                {"name": "Author", "value": "${{ github.event.issue.user.login }}", "inline": true}
              ],
              "footer": {"text": "NorthernStar Studio"}
            }]
          }
          EOF)

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            "$DISCORD_WEBHOOK"
